<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚙️ Admin — Catálogo Laser Johen</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--or:#E8650A;--ye:#F5A623;--dk:#150800;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:#0d0400;color:#fff;min-height:100vh;}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,#7a2e00,#3d1200 40%,#0d0400);z-index:0;}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 16px 80px;}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:2px solid rgba(245,166,35,.25);margin-bottom:28px;position:sticky;top:0;background:#0d0400;z-index:50;}
.hdr-left{display:flex;align-items:center;gap:12px;}
.hdr h1{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--ye);letter-spacing:1px;}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.4);letter-spacing:2px;text-transform:uppercase;}
.preview-btn{background:rgba(245,166,35,.15);border:1px solid rgba(245,166,35,.4);color:var(--ye);font-size:12px;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;text-decoration:none;transition:all .2s;}
.preview-btn:hover{background:var(--ye);color:#000;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px;}
.stat-card{background:rgba(0,0,0,.5);border:1px solid rgba(245,166,35,.15);border-radius:12px;padding:14px 16px;text-align:center;}
.stat-n{font-family:'Bebas Neue',sans-serif;font-size:34px;color:var(--ye);line-height:1;}
.stat-l{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.35);margin-top:3px;}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap;}
.tab{padding:8px 16px;border-radius:20px;border:1px solid rgba(245,166,35,.25);background:rgba(0,0,0,.4);color:rgba(255,255,255,.55);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .2s;white-space:nowrap;}
.tab.active{background:var(--or);border-color:var(--or);color:#fff;font-weight:700;}

/* FORM */
.form-card{background:rgba(0,0,0,.5);border:1px solid rgba(245,166,35,.15);border-radius:16px;padding:22px;margin-bottom:28px;}
.form-card h2{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;letter-spacing:1px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid rgba(245,166,35,.15);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.row1{margin-bottom:12px;}
.field label{display:block;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ye);margin-bottom:5px;font-weight:600;}
.field input,.field select,.field textarea{width:100%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-size:13px;font-family:'DM Sans',sans-serif;padding:10px 13px;outline:none;transition:border-color .2s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ye);}
.field textarea{resize:vertical;min-height:70px;}
.field select option{background:#1a0900;}

/* UPLOAD */
.upload-area{border:2px dashed rgba(245,166,35,.3);border-radius:10px;padding:22px;text-align:center;cursor:pointer;position:relative;transition:border-color .2s,background .2s;}
.upload-area:hover{border-color:var(--ye);background:rgba(245,166,35,.04);}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.upload-area .u-icon{font-size:30px;display:block;margin-bottom:6px;}
.upload-area p{font-size:11px;color:rgba(255,255,255,.35);}
.upload-area p strong{color:var(--ye);}
.prev-img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:2px solid rgba(245,166,35,.4);margin-top:10px;display:none;}

/* VARIAÇÕES */
.cor-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:8px 10px;}
.cor-row input[type=color]{width:32px;height:32px;border:none;border-radius:6px;cursor:pointer;background:none;padding:0;flex-shrink:0;}
.cor-row input[type=text]{flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);border-radius:6px;color:#fff;font-size:12px;padding:6px 9px;outline:none;font-family:'DM Sans',sans-serif;}
.cor-row input[type=text]:focus{border-color:var(--ye);}
.cor-foto-label{position:relative;cursor:pointer;flex-shrink:0;}
.cor-foto-label input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
.cor-foto-btn{background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.25);color:var(--ye);font-size:10px;padding:5px 10px;border-radius:6px;white-space:nowrap;}
.cor-prev{width:30px;height:30px;object-fit:cover;border-radius:5px;border:1px solid rgba(255,255,255,.15);display:none;flex-shrink:0;}
.cor-del{background:rgba(200,50,50,.18);border:1px solid rgba(200,50,50,.25);color:#f88;width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.add-cor-btn{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.25);color:var(--ye);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;margin-top:6px;transition:all .2s;}
.add-cor-btn:hover{background:rgba(245,166,35,.2);}

/* BUTTONS */
.btn-save{width:100%;background:linear-gradient(135deg,var(--or),var(--ye));color:#000;font-size:15px;font-weight:700;font-family:'DM Sans',sans-serif;padding:14px;border:none;border-radius:10px;cursor:pointer;margin-top:10px;letter-spacing:.4px;transition:opacity .2s;}
.btn-save:hover{opacity:.85;}
.btn-cancel{width:100%;background:rgba(200,50,50,.12);border:1px solid rgba(200,50,50,.22);color:#f88;padding:10px;border-radius:10px;cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;margin-top:8px;display:none;transition:all .2s;}
.btn-cancel:hover{background:rgba(200,50,50,.22);}
.btn-export{background:rgba(100,200,100,.12);border:1px solid rgba(100,200,100,.25);color:#8f8;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;transition:all .2s;}
.btn-export:hover{background:rgba(100,200,100,.22);}
.btn-import{background:rgba(100,150,255,.12);border:1px solid rgba(100,150,255,.25);color:#aaf;padding:9px 16px;border-radius:8px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;position:relative;overflow:hidden;transition:all .2s;}
.btn-import:hover{background:rgba(100,150,255,.22);}
.btn-import input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}

/* PRODUCT LIST */
.prod-list{display:flex;flex-direction:column;gap:8px;}
.prod-item{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:10px 14px;transition:border-color .2s;}
.prod-item:hover{border-color:rgba(245,166,35,.2);}
.prod-thumb{width:46px;height:46px;border-radius:7px;background:#1a0800;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;}
.prod-thumb img{width:100%;height:100%;object-fit:cover;}
.prod-info{flex:1;min-width:0;}
.prod-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prod-cat{font-size:10px;color:var(--ye);opacity:.75;margin-top:2px;}
.prod-mat{font-size:10px;color:rgba(255,255,255,.35);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prod-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-edit{background:rgba(245,166,35,.15);border:1px solid rgba(245,166,35,.3);color:var(--ye);border-radius:7px;padding:6px 12px;cursor:pointer;font-size:11px;font-family:'DM Sans',sans-serif;transition:all .2s;}
.btn-edit:hover{background:rgba(245,166,35,.3);}
.btn-del{background:rgba(200,50,50,.15);border:1px solid rgba(200,50,50,.25);color:#f88;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:11px;transition:all .2s;}
.btn-del:hover{background:rgba(200,50,50,.25);}
.empty-list{text-align:center;padding:30px;color:rgba(255,255,255,.25);font-size:13px;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:10px;font-size:13px;z-index:900;opacity:0;transition:opacity .3s;pointer-events:none;font-family:'DM Sans',sans-serif;}
.toast.ok{background:#0d3300;border:1px solid #4caf50;color:#fff;}
.toast.err{background:#330000;border:1px solid #f44336;color:#fff;}
.toast.on{opacity:1;}

/* SECTION DIVIDER */
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;letter-spacing:1px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.sec-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right,rgba(245,166,35,.3),transparent);}
.tools-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">

<div class="hdr">
  <div class="hdr-left">
    <svg style="height:34px;" viewBox="0 0 220 50" xmlns="http://www.w3.org/2000/svg">
      <text y="36" font-size="38" font-family="serif" font-weight="900" fill="white" letter-spacing="-1">JOHEN</text>
      <text x="4" y="47" font-size="9" font-family="sans-serif" fill="white" opacity="0.55" letter-spacing="3">ARTES GRÁFICAS</text>
    </svg>
    <div>
      <div class="hdr-sub">Painel de Administração</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <a href="index.html" target="_blank" class="preview-btn">👁️ Ver Site</a>
  </div>
</div>

<!-- STATS -->
<div class="stats-row" id="stats-row">
  <div class="stat-card"><div class="stat-n" id="st-total">0</div><div class="stat-l">Produtos</div></div>
  <div class="stat-card"><div class="stat-n" id="st-cats">7</div><div class="stat-l">Categorias</div></div>
  <div class="stat-card"><div class="stat-n" id="st-com-foto">0</div><div class="stat-l">Com Foto</div></div>
  <div class="stat-card"><div class="stat-n" id="st-sem-foto">0</div><div class="stat-l">Sem Foto Real</div></div>
</div>

<!-- TOOLS -->
<div class="sec-title">🛠️ Ferramentas</div>
<div class="tools-row">
  <button class="btn-export" onclick="exportDB()">📥 Exportar Catálogo (JSON)</button>
  <label class="btn-import">📤 Importar Catálogo (JSON)<input type="file" accept=".json" onchange="importDB(this)"></label>
  <button class="btn-export" onclick="clearAll()" style="background:rgba(200,50,50,.1);border-color:rgba(200,50,50,.25);color:#f88;">🗑️ Limpar Tudo</button>
</div>

<!-- FORM -->
<div class="form-card">
  <h2 id="form-title">➕ Adicionar Produto</h2>
  <input type="hidden" id="edit-id">

  <div class="row2">
    <div class="field"><label>Nome do Produto *</label><input type="text" id="f-nome" placeholder="Ex: Caneta Metal Slim"></div>
    <div class="field"><label>Categoria *</label>
      <select id="f-cat">
        <option value="canetas">✏️ Canetas</option>
        <option value="kits">🎁 Kits Executivos</option>
        <option value="canecas">☕ Canecas & Copos</option>
        <option value="garrafas">🍶 Garrafas</option>
        <option value="squeezes">💧 Squeezes</option>
        <option value="couro">📓 Couro & Agendas</option>
        <option value="outros">🪵 Outros</option>
      </select>
    </div>
  </div>
  <div class="row2">
    <div class="field"><label>Material</label><input type="text" id="f-mat" placeholder="Ex: Aço inoxidável 304. Parede dupla."></div>
    <div class="field"><label>Área de Gravação</label><input type="text" id="f-area" placeholder="Ex: 8 × 5 cm"></div>
  </div>
  <div class="row1 field"><label>Técnica Recomendada</label><input type="text" id="f-tec" placeholder="Ex: Laser de fibra com eixo rotativo"></div>
  <div class="row1 field"><label>Observações da Gráfica</label><textarea id="f-obs" placeholder="Dicas técnicas, potência recomendada, resultado esperado..."></textarea></div>
  <div class="row1 field"><label>Tipo de Material (para cuidados automáticos)</label>
    <select id="f-tipo">
      <option value="inox">Inox / Aço Inoxidável</option>
      <option value="aluminio">Alumínio Anodizado</option>
      <option value="metal">Metal / Liga Metálica</option>
      <option value="couro">Couro Sintético (PU)</option>
      <option value="mdf">MDF</option>
      <option value="vidro">Vidro</option>
    </select>
  </div>

  <!-- FOTO PRINCIPAL -->
  <div class="row1 field">
    <label>Foto Principal do Produto</label>
    <div class="upload-area">
      <input type="file" accept="image/*" onchange="handleUp(this,'main')">
      <span class="u-icon">🖼️</span>
      <p>Clique ou arraste a foto aqui<br><strong>JPG, PNG, WEBP — recomendado 600×600px</strong></p>
      <img id="f-prev" class="prev-img">
    </div>
  </div>

  <!-- VARIAÇÕES -->
  <div class="row1 field">
    <label>Variações de Cor / Modelo</label>
    <div id="cores-list"></div>
    <button class="add-cor-btn" onclick="addCor()">+ Adicionar Variação</button>
  </div>

  <button class="btn-save" onclick="saveProduct()">💾 Salvar Produto no Catálogo</button>
  <button class="btn-cancel" id="btn-cancel" onclick="cancelEdit()">✕ Cancelar Edição</button>
</div>

<!-- PRODUCT LIST -->
<div class="sec-title">📦 Produtos Cadastrados</div>

<!-- TABS CATEGORIA -->
<div class="tabs" id="tabs">
  <button class="tab active" data-cat="all">Todos</button>
  <button class="tab" data-cat="canetas">✏️ Canetas</button>
  <button class="tab" data-cat="kits">🎁 Kits</button>
  <button class="tab" data-cat="canecas">☕ Canecas</button>
  <button class="tab" data-cat="garrafas">🍶 Garrafas</button>
  <button class="tab" data-cat="squeezes">💧 Squeezes</button>
  <button class="tab" data-cat="couro">📓 Couro</button>
  <button class="tab" data-cat="outros">🪵 Outros</button>
</div>

<div class="prod-list" id="prod-list"></div>

</div><!-- /wrap -->

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY='johen_laser_v3';
const CAT_LABELS={canetas:'✏️ Canetas',kits:'🎁 Kits',canecas:'☕ Canecas',garrafas:'🍶 Garrafas',squeezes:'💧 Squeezes',couro:'📓 Couro',outros:'🪵 Outros'};
const SVGS={
  caneta:`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="42" y="10" width="16" height="65" rx="6" fill="#c8a84b"/><rect x="44" y="12" width="12" height="55" rx="4" fill="#e8c96a"/><ellipse cx="50" cy="78" rx="6" ry="9" fill="#aaa"/><rect x="46" y="8" width="8" height="8" rx="2" fill="#888"/></svg>`,

  caneca:`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="25" width="48" height="55" rx="8" fill="#aaa"/><rect x="22" y="27" width="44" height="51" rx="6" fill="#c8c8c8"/><path d="M68 40 Q85 40 85 55 Q85 70 68 70" stroke="#aaa" stroke-width="8" fill="none" stroke-linecap="round"/></svg>`,
  garrafa:`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="35" y="5" width="30" height="12" rx="4" fill="#888"/><rect x="30" y="15" width="40" height="75" rx="10" fill="#aaa"/><rect x="32" y="17" width="36" height="71" rx="8" fill="#c8c8c8"/></svg>`,
  squeeze:`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="32" y="8" width="36" height="78" rx="12" fill="#4caf50"/><rect x="34" y="10" width="32" height="74" rx="10" fill="#66bb6a"/><rect x="38" y="4" width="24" height="10" rx="4" fill="#388e3c"/></svg>`,
  couro:`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect x="15" y="12" width="70" height="80" rx="5" fill="#5d4037"/><rect x="17" y="14" width="66" height="76" rx="4" fill="#795548"/><rect x="88" y="30" width="4" height="50" rx="2" fill="#f5a623"/></svg>`,
  outros:`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="38" r="22" fill="none" stroke="#c8a84b" stroke-width="8"/><rect x="46" y="58" width="8" height="28" rx="3" fill="#c8a84b"/></svg>`,
};
function getSVG(cat){const m={canetas:'caneta',kits:'kit',canecas:'caneca',garrafas:'garrafa',squeezes:'squeeze',couro:'couro'};return SVGS[m[cat]]||SVGS.outros;}
function mkImg(cat){return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(getSVG(cat))}`;}

function loadDB(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r);}catch(e){}return defaultDB();}
function saveDB(d){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(d));}catch(e){showToast('Erro ao salvar! Arquivo pode ser muito grande.','err');}}

      {id:'cn2',nome:'Caneta Metal Coração',mat:'Liga metálica polida. Ponteira em resina.',area:'5 × 1 cm',tec:'Laser de fibra',obs:'Apelo feminino. Brindes de beleza e moda.',tipo:'metal',img:I('canetas'),cores:[{n:'Rosa',c:'#e897b0',img:I('canetas')},{n:'Prata',c:'#c0c0c0',img:I('canetas')}]},
      {id:'cn3',nome:'Caneta Metal Coroa',mat:'Metal acabamento matte. Detalhes cromados.',area:'5,5 × 1 cm',tec:'Laser de fibra',obs:'Matte facilita gravação com alto contraste.',tipo:'metal',img:I('canetas'),cores:[]},
      {id:'cn4',nome:'Caneta Metal Rosa',mat:'Metal com laca rosa. Clip metálico.',area:'6 × 1 cm',tec:'Laser de fibra',obs:'Laca rosa remove expondo metal dourado.',tipo:'metal',img:I('canetas'),cores:[]},
      {id:'cn5',nome:'Caneta Semi Metal',mat:'Alumínio anodizado. Tampa e clip ABS.',area:'6 × 1 cm',tec:'Laser de fibra',obs:'Alumínio anodizado: marcação clara e permanente.',tipo:'aluminio',img:I('canetas'),cores:[]},
      {id:'cn6',nome:'Caneta Metal Slim',mat:'Liga metálica fina. Tampa magnética.',area:'5,5 × 0,8 cm',tec:'Laser de fibra',obs:'Perfil fino. Ótima para logotipos compactos.',tipo:'metal',img:I('canetas'),cores:[]},
      {id:'cn7',nome:'Caneta Roller Semi Metal',mat:'Roller ball. Alumínio e ABS. Carga preta.',area:'6 × 1 cm',tec:'Laser de fibra',obs:'Escrita mais fluida. Premium corporativo.',tipo:'aluminio',img:I('canetas'),cores:[]},
    ],
    kits:[
      {id:'kt1',nome:'Conjunto Caneta + Lapiseira Metal',mat:'Caneta e lapiseira matte. Estojo incluso.',area:'5,5 × 1 cm/peça',tec:'Laser de fibra (gravar as duas)',obs:'Gravar em sequência para alinhamento idêntico.',tipo:'metal',img:I('kits'),cores:[]},
      {id:'kt2',nome:'Kit Executivo 3 Peças',mat:'Caneta + lapiseira + régua. Estojo couro PU.',area:'5,5 × 1 cm',tec:'Laser fibra + CO₂',obs:'Combo premium. Gravar estojo e caneta.',tipo:'couro',img:I('kits'),cores:[]},
      {id:'kt3',nome:'Kit Caneta + Porta Cartão',mat:'Caneta metal + porta cartão PU.',area:'Caneta 5 × 1 cm',tec:'Laser fibra + CO₂',obs:'Alta percepção de valor. Ideal para VIP.',tipo:'couro',img:I('kits'),cores:[]},
    ],
    canecas:[
      {id:'ca1',nome:'Caneca Inox 400ml',mat:'Aço inoxidável 304. Parede simples.',area:'8 × 5 cm',tec:'Laser de fibra (oxidação)',obs:'Inox 304 grava excelente.',tipo:'inox',img:I('canecas'),cores:[]},

let db=loadDB(), filterCat='all', editingId=null, imgMap={}, corCount=0;

// ─── STATS ───
function updateStats(){
  const all=Object.values(db).flat();
  const comFoto=all.filter(p=>p.img&&!p.img.includes('svg+xml')).length;
  document.getElementById('st-total').textContent=all.length;
  document.getElementById('st-com-foto').textContent=comFoto;
  document.getElementById('st-sem-foto').textContent=all.length-comFoto;
}

// ─── LIST ───
function renderList(){
  const el=document.getElementById('prod-list'); el.innerHTML='';
  const all=Object.entries(db).flatMap(([cat,list])=>list.map(p=>({...p,_cat:cat})));
  const f=filterCat==='all'?all:all.filter(p=>p._cat===filterCat);
  if(!f.length){el.innerHTML='<div class="empty-list">Nenhum produto nesta categoria.</div>';return;}
  f.forEach(p=>{
    const d=document.createElement('div'); d.className='prod-item';
    const isReal=p.img&&!p.img.includes('svg+xml');
    const thumb=isReal?`<div class="prod-thumb"><img src="${p.img}" onerror="this.parentElement.innerHTML='📦'"></div>`:`<div class="prod-thumb">${getSVGThumb(p._cat)}</div>`;
    d.innerHTML=`${thumb}<div class="prod-info"><div class="prod-name">${p.nome}</div><div class="prod-cat">${CAT_LABELS[p._cat]||p._cat} ${isReal?'📸':'🔲'}</div><div class="prod-mat">${(p.mat||'').substring(0,50)}</div></div><div class="prod-actions"><button class="btn-edit" onclick="editProd('${p.id}')">✏️ Editar</button><button class="btn-del" onclick="delProd('${p.id}')">🗑️</button></div>`;
    el.appendChild(d);
  });
  updateStats();
}
function getSVGThumb(cat){const m={canetas:'✏️',kits:'🎁',canecas:'☕',garrafas:'🍶',squeezes:'💧',couro:'📓'};return m[cat]||'🪵';}

// ─── UPLOAD ───
function handleUp(inp,ctx,idx){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    const b=e.target.result;
    if(ctx==='main'){imgMap['__main__']=b;const pv=document.getElementById('f-prev');pv.src=b;pv.style.display='block';}
    else{imgMap['__cor__'+idx]=b;const pv=document.getElementById('cprev-'+idx);if(pv){pv.src=b;pv.style.display='block';}}
  };
  r.readAsDataURL(f);
}

// ─── CORES ───
function addCor(n='',c='#aaa',img=''){
  const idx=corCount++;
  const d=document.createElement('div'); d.className='cor-row'; d.id='cor-'+idx;
  d.innerHTML=`<input type="color" value="${c}" id="cc-${idx}"><input type="text" placeholder="Nome (ex: Azul, Prata...)" value="${n}" id="cn-${idx}"><div class="cor-foto-label"><input type="file" accept="image/*" onchange="handleUp(this,'cor',${idx})"><span class="cor-foto-btn">🖼️ Foto</span></div><img id="cprev-${idx}" class="cor-prev" src="${img}" style="${img?'display:block':''}"><div class="cor-del" onclick="document.getElementById('cor-${idx}').remove()">×</div>`;
  document.getElementById('cores-list').appendChild(d);
  if(img)imgMap['__cor__'+idx]=img;
}
function getCores(){
  const cores=[];
  document.querySelectorAll('[id^="cor-"]').forEach(d=>{
    const idx=d.id.replace('cor-','');
    const nEl=document.getElementById('cn-'+idx);
    if(!nEl)return;
    const n=nEl.value.trim(), c=document.getElementById('cc-'+idx)?.value||'#aaa', img=imgMap['__cor__'+idx]||'';
    if(n)cores.push({n,c,img});
  });
  return cores;
}

// ─── SAVE ───
function genId(){return 'p'+Date.now()+Math.random().toString(36).slice(2,5);}
function findProd(id){for(const l of Object.values(db)){const p=l.find(p=>p.id===id);if(p)return p;}return null;}
function findCat(id){for(const[k,l]of Object.entries(db)){if(l.find(p=>p.id===id))return k;}return 'canetas';}

function saveProduct(){
  const nome=document.getElementById('f-nome').value.trim();
  const cat=document.getElementById('f-cat').value;
  if(!nome){showToast('⚠️ Nome obrigatório!','err');return;}
  const prod={
    id:editingId||genId(), nome,
    mat:document.getElementById('f-mat').value.trim(),
    area:document.getElementById('f-area').value.trim(),
    tec:document.getElementById('f-tec').value.trim(),
    obs:document.getElementById('f-obs').value.trim(),
    tipo:document.getElementById('f-tipo').value,
    img:imgMap['__main__']||(editingId?findProd(editingId)?.img||mkImg(cat):''),
    cores:getCores()
  };
  if(!prod.img)prod.img=mkImg(cat);
  if(editingId){
    for(const[k,l]of Object.entries(db)){
      const i=l.findIndex(p=>p.id===editingId);
      if(i!==-1){if(k===cat){db[k][i]=prod;}else{db[k].splice(i,1);if(!db[cat])db[cat]=[];db[cat].push(prod);}break;}
    }
    showToast('✅ Produto atualizado!');
  }else{
    if(!db[cat])db[cat]=[];
    db[cat].push(prod);
    showToast('✅ Produto adicionado!');
  }
  saveDB(db);renderList();clearForm();
}

function editProd(id){
  const p=findProd(id);if(!p)return;
  editingId=id;
  document.getElementById('form-title').textContent='✏️ Editando: '+p.nome;
  document.getElementById('f-nome').value=p.nome;
  document.getElementById('f-cat').value=findCat(id);
  document.getElementById('f-mat').value=p.mat||'';
  document.getElementById('f-area').value=p.area||'';
  document.getElementById('f-tec').value=p.tec||'';
  document.getElementById('f-obs').value=p.obs||'';
  document.getElementById('f-tipo').value=p.tipo||'inox';
  if(p.img&&!p.img.includes('svg+xml')){imgMap['__main__']=p.img;const pv=document.getElementById('f-prev');pv.src=p.img;pv.style.display='block';}
  document.getElementById('cores-list').innerHTML='';corCount=0;
  (p.cores||[]).forEach(c=>addCor(c.n,c.c,c.img));
  document.getElementById('btn-cancel').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function delProd(id){
  if(!confirm('Excluir este produto?'))return;
  for(const k of Object.keys(db))db[k]=db[k].filter(p=>p.id!==id);
  saveDB(db);renderList();showToast('🗑️ Produto removido.');
}

function cancelEdit(){editingId=null;clearForm();document.getElementById('form-title').textContent='➕ Adicionar Produto';document.getElementById('btn-cancel').style.display='none';}
function clearForm(){
  ['f-nome','f-mat','f-area','f-tec','f-obs'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  imgMap={};const pv=document.getElementById('f-prev');if(pv){pv.src='';pv.style.display='none';}
  document.getElementById('cores-list').innerHTML='';corCount=0;editingId=null;
}

// ─── EXPORT / IMPORT ───
function exportDB(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='catalogo-johen-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  showToast('📥 Catálogo exportado!');
}
function importDB(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);db=d;saveDB(db);renderList();showToast('📤 Catálogo importado com sucesso!');}catch(err){showToast('❌ Arquivo inválido!','err');}};
  r.readAsText(f);
}
function clearAll(){if(!confirm('ATENÇÃO: Isso vai apagar TODOS os produtos! Tem certeza?'))return;localStorage.removeItem(STORAGE_KEY);db=defaultDB();saveDB(db);renderList();showToast('🗑️ Catálogo resetado.');}

function showToast(m,type='ok'){const t=document.getElementById('toast');t.textContent=m;t.className=`toast ${type} on`;setTimeout(()=>t.classList.remove('on'),2800);}

// ─── TABS ───
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));this.classList.add('active');filterCat=this.dataset.cat;renderList();});
});

renderList();
</script>
